services:
  - type: web
    name: corndogkane
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: off
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    startCommand: node scripts/start-secure.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: CHECKPOINT_DISABLE
        value: "1"
      - key: NODE_EXTRA_CA_CERTS
        value: integrations/supabase/prod-ca-2021.crt
      - key: HRIS_DEMO_MODE
        value: "0"
      - key: SECURITY_RUNTIME_DATABASE
        value: "1"
      - key: SECURITY_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
